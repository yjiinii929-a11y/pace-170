<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820"><title>PACE 170</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#f6faf8;background:#101820}
body{max-width:650px;margin:auto;padding:22px 16px 80px}h1{margin:8px 0}p,small{color:#a8b8b3}
header{display:flex;justify-content:space-between;align-items:center}.tag{color:#a8f29d}
.panel{background:#1d2a31;border-radius:18px;padding:18px;margin:18px 0}
label{display:block;margin:12px 0}input{background:#0e171d;color:white;border:1px solid #53626a;border-radius:9px;padding:8px;width:90px;font-size:16px}
input[type=file]{width:100%;box-sizing:border-box}button{background:#a8f29d;color:#102018;border:0;border-radius:12px;padding:10px 14px;font-weight:700}
.track{padding:14px 0;border-bottom:1px solid #36434b;display:flex;gap:12px;justify-content:space-between;align-items:center}
.track div{min-width:0}.track b{display:block}.track small{display:block;margin-top:5px}.track input{width:68px}
.note{font-size:13px;line-height:1.5}audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<header><b>🎵 PACE 170</b><span class="tag">RUN MODE</span></header>
<h1>2014~ 예진</h1><p>좋아하는 노래를 170 BPM에 맞춰 달리기</p>
<section class="panel"><label>목표 BPM <input id="target" type="number" min="1" value="170"></label>
<p id="summary">곡별 원본 BPM을 입력하면 변속 비율이 계산돼요.</p>
</section>
<h2>플레이리스트 · 10곡</h2><div id="tracks"></div>
<section class="panel"><h2>음원 파일 테스트</h2>
<p class="note">이 기능은 유튜브 뮤직 음원을 가져오지 않습니다. 직접 사용 권한이 있는 음원 파일을 선택해 주세요.</p>
<input id="file" type="file" accept="audio/*">
<label>테스트 음원의 원본 BPM <input id="fileBpm" type="number" min="1" value="160"></label>
<button id="play">170 BPM으로 재생</button> <button id="pause">일시정지</button>
<audio id="audio" controls></audio><p id="status" class="note"></p></section>
<script>
const songs=[
["Etude","Girls' Generation","3:14"],
["Baby Steps","Girls' Generation-TTS","3:56"],
["동화 My Child","Girls' Generation","3:37"],
["크리스마스니까","성시경","3:46"],
["애기야 (My Baby U)","서인국","3:49"],
["사랑해 U (Lovely Ver.)","서인국","3:47"],
["초록비 (Green Rain)","SHINee","3:44"],
["방백 Aside","SHINee","3:45"],
["JoJo","SHINee","3:38"],
["사.계.한 Love Should Go On","SHINee","3:12"]];
const key="pace170-bpms-v1";let saved={};
try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
const tracks=document.getElementById("tracks"),target=document.getElementById("target");
function draw(){
tracks.innerHTML="";
songs.forEach((song,i)=>{
const row=document.createElement("div");row.className="track";
const info=document.createElement("div"),name=document.createElement("b"),artist=document.createElement("small"),rate=document.createElement("small");
name.textContent=(i+1)+". "+song[0];artist.textContent=song[1]+" · "+song[2];
info.append(name,artist,rate);
const inp=document.createElement("input");inp.type="number";inp.min="1";inp.placeholder="BPM";inp.setAttribute("aria-label",song[0]+" 원본 BPM");inp.value=saved[i]||"";
function update(){
const bpm=Number(inp.value),t=Number(target.value);
rate.textContent=bpm>0&&t>0?"변속: "+(t/bpm).toFixed(3)+"배":"원본 BPM을 입력해 주세요";
}
inp.addEventListener("input",()=>{saved[i]=inp.value;try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}update()});
target.addEventListener("input",update);update();row.append(info,inp);tracks.append(row);
});
}
draw();
const audio=document.getElementById("audio"),file=document.getElementById("file"),status=document.getElementById("status");
let fileUrl;
file.addEventListener("change",()=>{
if(fileUrl)URL.revokeObjectURL(fileUrl);
if(file.files[0]){fileUrl=URL.createObjectURL(file.files[0]);audio.src=fileUrl;status.textContent="파일 준비 완료";}
});
document.getElementById("play").onclick=async()=>{
const bpm=Number(document.getElementById("fileBpm").value),t=Number(target.value);
if(!file.files[0]||bpm<=0||t<=0){status.textContent="파일과 BPM을 확인해 주세요.";return}
const rate=t/bpm;
if(rate<0.5||rate>4){status.textContent="이 브라우저에서 지원되지 않을 수 있는 변속 범위예요.";return}
audio.playbackRate=rate;audio.preservesPitch=true;
try{await audio.play();status.textContent=rate.toFixed(3)+"배속 재생 중 (음정 유지 지원은 브라우저에 따라 다름)";}
catch(e){status.textContent="재생할 수 없습니다: "+e.message}
};
document.getElementById("pause").onclick=()=>audio.pause();
</script></body></html>
